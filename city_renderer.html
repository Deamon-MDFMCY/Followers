<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Infinite City Engine - Renderer</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #121c26; font-family: sans-serif; cursor: default; }
        body.edit-mode { cursor: crosshair; }
        #tooltip {
            position: absolute; background: rgba(0, 0, 0, 0.9); color: #fff;
            padding: 10px 15px; border-radius: 6px; pointer-events: none; opacity: 0;
            font-weight: bold; font-size: 15px; transform: translate(-50%, -150%);
            border: 2px solid #ffd700; box-shadow: 0px 4px 10px rgba(0,0,0,0.5);
            z-index: 100; white-space: nowrap; transition: opacity 0.2s;
        }
        #save-indicator {
            position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.6);
            color: #00ffcc; padding: 4px 10px; border-radius: 4px; font-size: 11px;
            opacity: 0; transition: opacity 0.3s; z-index: 99; pointer-events: none;
        }
        #save-indicator.visible { opacity: 1; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="tooltip">Subscriber Name</div>
    <div id="save-indicator">Saved</div>

    <script>
        // --- 1. CHANNEL COMMUNICATION & STATE ---
        const channel = new BroadcastChannel('city_sync');
        let currentTool = 'none';
        let is2DMode = false;
        let currentTheme = 'nocturne';
        const WORLD_SEED = 133742;
        const SAVE_KEY = 'city_save_v1';
        const SAVE_DEBOUNCE_MS = 1000;
        const UNDO_LIMIT = 100;

        // Pending diffs to send to the UI on next sync tick
        let pendingDiffs = [];
        let statsDirty = true;
        // Undo stack: each entry is a self-contained inverse action
        let undoStack = [];
        // Action log for persistence: complete record of city construction
        let actionLog = [];
        let saveTimer = null;
        let isRestoring = false; // suppress autosave + undo logging during replay

        const channelHandlers = {
            TOGGLE_ROTATION: () => { controls.autoRotate = !controls.autoRotate; },
            TOGGLE_VIEW: () => {
                is2DMode = !is2DMode; controls.autoRotate = false; controls.enableRotate = !is2DMode;
                targetCameraPos.set(controls.target.x + (is2DMode ? 0 : 100), is2DMode ? 300 : 100, controls.target.z + (is2DMode ? 0 : 100));
                targetControlsPos.copy(controls.target); targetCameraZoom = is2DMode ? 0.8 : 1.0; isCameraAnimating = true;
            },
            SIMULATE: (d) => simulateSubscribers(d.count, d.anim),
            SPAWN_REAL: (d) => spawnSubscriber(true, d.name),
            SEARCH: (d) => searchSubscriber(d.term),
            SET_TOOL: (d) => {
                currentTool = d.tool; document.body.className = currentTool === 'none' ? '' : 'edit-mode';
                controls.enableRotate = (currentTool === 'none' && !is2DMode);
            },
            BUILD_ACTION: (d) => {
                if (d.tool === 'reserve') reserveParcel(d.x, d.z);
                else if (d.tool === 'road') addRoad(d.x, d.z, null, true);
                else if (d.tool === 'remove') removeGridItem(d.x, d.z);
            },
            SET_THEME: (d) => { if (themes[d.theme]) { currentTheme = d.theme; applyTheme(); } },
            REQUEST_FULL_MAP: () => sendFullMap(),
            UNDO: () => performUndo(),
            SAVE: () => { saveNow(); flashSaveIndicator(); },
            LOAD: () => { loadFromStorage(true); },
            RESET: () => { resetCity(); }
        };

        channel.onmessage = (event) => {
            const h = channelHandlers[event.data.type];
            if (h) h(event.data);
        };

        // --- DIFF SYNC ---
        function emitCellAdded(gx, gz, type) {
            pendingDiffs.push({ op: 'add', x: gx, z: gz, t: type });
            statsDirty = true;
        }
        function emitCellRemoved(gx, gz) {
            pendingDiffs.push({ op: 'rm', x: gx, z: gz });
            statsDirty = true;
        }
        function sendFullMap() {
            channel.postMessage({
                type: 'MAP_FULL',
                map: Array.from(gridMap.entries()),
                pop: populationCount,
                chunks: chunks.length
            });
            pendingDiffs = []; statsDirty = false;
        }
        // 100ms tick: flush pending diffs
        setInterval(() => {
            if (pendingDiffs.length > 0) {
                channel.postMessage({ type: 'DIFFS', diffs: pendingDiffs });
                pendingDiffs = [];
            }
            if (statsDirty) {
                channel.postMessage({ type: 'STATS', pop: populationCount, chunks: chunks.length });
                statsDirty = false;
            }
        }, 100);
        // Announce ready so UI can request a full snapshot
        setTimeout(() => channel.postMessage({ type: 'RENDERER_READY' }), 100);

        // --- 2. BIOME & NOISE SYSTEM ---
        function getBiomeNoise(x, z) {
            let scale = 0.03; let n = Math.sin(x * scale) + Math.cos(z * scale) + Math.sin((x + z) * scale * 1.5) * 0.5 + Math.cos((x - z) * scale * 0.8) * 0.5; return (n + 3) / 6;
        }
        function jitterColor(hex, amount) {
            let r = (hex >> 16) & 0xff; let g = (hex >> 8) & 0xff; let b = hex & 0xff;
            let j = (Math.random() - 0.5) * amount; r = Math.max(0, Math.min(255, r + j)); g = Math.max(0, Math.min(255, g + j)); b = Math.max(0, Math.min(255, b + j));
            return (r << 16) | (g << 8) | b;
        }
        function hash01(a, b = 0, c = 0) {
            let n = (a * 374761393 + b * 668265263 + c * 1442695041 + WORLD_SEED * 374761393) | 0;
            n = (n ^ (n >> 13)) * 1274126177;
            n = n ^ (n >> 16);
            return (n >>> 0) / 4294967295;
        }

        const themes = {
            nocturne: {
                bg: 0x121c26, fog: 0x121c26, ocean: 0x1a2e3b, water: 0x2a4b5c, field: 0x6b5438, forestGround: 0x2d4233,
                houseColors: [0x3b3d42, 0x47494e, 0x2d2e33, 0x51545a], leafColors: [0x354a3d, 0x3e5446, 0x293d31, 0x485d4b],
                trunk: 0x3b342d, roof: 0x24262a, road: 0x4a4d54
            },
            synthwave: {
                bg: 0x180c2a, fog: 0x180c2a, ocean: 0x21153a, water: 0x3c2f78, field: 0x5b3750, forestGround: 0x2b1f42,
                houseColors: [0x5e4db2, 0x7f65d9, 0x51379a, 0x8a6df2], leafColors: [0x365a7a, 0x4f6fb0, 0x2c4966, 0x6383c2],
                trunk: 0x48345a, roof: 0x2a2140, road: 0x3a3553
            },
            verdant: {
                bg: 0x0f1a16, fog: 0x0f1a16, ocean: 0x1c2f34, water: 0x2a5960, field: 0x5e6339, forestGround: 0x284529,
                houseColors: [0x66614a, 0x7a6f57, 0x564f3d, 0x8a7f67], leafColors: [0x3d6438, 0x487a42, 0x2f5230, 0x5a8c4f],
                trunk: 0x4b3a2a, roof: 0x353229, road: 0x50584a
            }
        };

        // --- 3. SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(themes[currentTheme].bg);
        scene.fog = new THREE.Fog(themes[currentTheme].fog, 100, 2000);

        const aspect = window.innerWidth / window.innerHeight; const d = 120;
        const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, -10000, 20000); camera.position.set(100, 100, 100);

        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputEncoding = THREE.sRGBEncoding;
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; controls.dampingFactor = 0.05; controls.autoRotate = true; controls.autoRotateSpeed = 0.5;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.75); scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.0); dirLight.position.set(200, 300, 100); dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 4096; dirLight.shadow.mapSize.height = 4096; dirLight.shadow.camera.left = -1000; dirLight.shadow.camera.right = 1000;
        dirLight.shadow.camera.top = 1000; dirLight.shadow.camera.bottom = -1000; scene.add(dirLight);

        const planeGeo = new THREE.PlaneGeometry(50000, 50000); const planeMat = new THREE.MeshStandardMaterial({ color: themes[currentTheme].ocean, roughness: 0.8 });
        const plane = new THREE.Mesh(planeGeo, planeMat); plane.rotation.x = -Math.PI / 2; plane.position.y = -0.5; plane.receiveShadow = true; scene.add(plane);

        // --- 4. DYNAMIC CHUNK SYSTEM ---
        const HOUSES_PER_CHUNK = 20000;
        const boxGeo = new THREE.BoxGeometry(1, 1, 1); const plane1Geo = new THREE.PlaneGeometry(1, 1);
        const roofGeo = new THREE.CylinderGeometry(0, 0.5, 1, 4); roofGeo.rotateY(Math.PI / 4);
        const trunkGeo = new THREE.CylinderGeometry(0.15, 0.15, 1, 4); trunkGeo.rotateY(Math.PI / 4);
        const pineGeo = new THREE.CylinderGeometry(0, 0.5, 1, 4); pineGeo.rotateY(Math.PI / 4);

        const groundGeo = new THREE.PlaneGeometry(5.0, 5.0); groundGeo.rotateX(-Math.PI / 2);

        function makeNoiseTexture(baseHex, jitter, size = 64) {
            const canvas = document.createElement('canvas'); canvas.width = size; canvas.height = size;
            const c2 = canvas.getContext('2d');
            const br = (baseHex >> 16) & 255; const bg = (baseHex >> 8) & 255; const bb = baseHex & 255;
            const img = c2.createImageData(size, size);
            for (let i = 0; i < img.data.length; i += 4) {
                const n = (Math.random() - 0.5) * jitter;
                img.data[i] = Math.max(0, Math.min(255, br + n));
                img.data[i + 1] = Math.max(0, Math.min(255, bg + n));
                img.data[i + 2] = Math.max(0, Math.min(255, bb + n));
                img.data[i + 3] = 255;
            }
            c2.putImageData(img, 0, 0);
            const tx = new THREE.CanvasTexture(canvas);
            tx.wrapS = THREE.RepeatWrapping; tx.wrapT = THREE.RepeatWrapping; tx.repeat.set(2, 2);
            return tx;
        }

        const wallMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.92, map: makeNoiseTexture(0x808080, 22) });
        const roofMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.88, map: makeNoiseTexture(0x5a5a5a, 28) });
        const roadMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.94, map: makeNoiseTexture(0x4a4d54, 18) });
        const winMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffeebb, emissiveIntensity: 1.2 });
        const trunkMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.95, map: makeNoiseTexture(0x5a4633, 18) });
        const foliageMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.98, map: makeNoiseTexture(0x35503a, 16) });
        const propMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.9, map: makeNoiseTexture(0x6b5b4f, 22) });
        const groundMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1.0, map: makeNoiseTexture(0x5b654f, 16) });
        const waterMat = new THREE.MeshStandardMaterial({ color: themes[currentTheme].water, roughness: 0.18, metalness: 0.08, transparent: true, opacity: 0.9 });

        let chunks = []; let houseData = []; let activeAnimations = [];
        const animatedWater = [];
        const dummy = new THREE.Object3D(); const dummyColor = new THREE.Color(); const highlightColor = new THREE.Color(0xffd700);

        function createChunk() {
            let cIdx = chunks.length;
            let c = {
                idx: cIdx, houseCount: 0,
                walls: new THREE.InstancedMesh(boxGeo, wallMat, HOUSES_PER_CHUNK * 6), roofs: new THREE.InstancedMesh(roofGeo, roofMat, HOUSES_PER_CHUNK),
                windows: new THREE.InstancedMesh(plane1Geo, winMat, HOUSES_PER_CHUNK * 3), roads: new THREE.InstancedMesh(plane1Geo, roadMat, HOUSES_PER_CHUNK * 2),
                trunks: new THREE.InstancedMesh(trunkGeo, trunkMat, HOUSES_PER_CHUNK * 3), crowns: new THREE.InstancedMesh(pineGeo, foliageMat, HOUSES_PER_CHUNK * 6),
                bushes: new THREE.InstancedMesh(boxGeo, foliageMat, HOUSES_PER_CHUNK * 4),
                pBoxes: new THREE.InstancedMesh(boxGeo, propMat, HOUSES_PER_CHUNK * 4), pGlows: new THREE.InstancedMesh(boxGeo, winMat, HOUSES_PER_CHUNK),
                grounds: new THREE.InstancedMesh(groundGeo, groundMat, HOUSES_PER_CHUNK * 2),
                waters: new THREE.InstancedMesh(groundGeo, waterMat, HOUSES_PER_CHUNK * 2),
                wCount: 0, rCount: 0, winCount: 0, rdCount: 0, trCount: 0, crCount: 0, bCount: 0, pbCount: 0, pgCount: 0, gCount: 0, waCount: 0,
                wallToHouse: new Int32Array(HOUSES_PER_CHUNK * 6), roofToHouse: new Int32Array(HOUSES_PER_CHUNK),
                instanceToGrid: new Map()
            };

            dummy.scale.set(0,0,0); dummy.updateMatrix();
            for(let i=0; i<HOUSES_PER_CHUNK * 6; i++) { c.walls.setMatrixAt(i, dummy.matrix); c.crowns.setMatrixAt(i, dummy.matrix); }
            for(let i=0; i<HOUSES_PER_CHUNK * 4; i++) { c.bushes.setMatrixAt(i, dummy.matrix); c.pBoxes.setMatrixAt(i, dummy.matrix); }
            for(let i=0; i<HOUSES_PER_CHUNK * 3; i++) { c.windows.setMatrixAt(i, dummy.matrix); c.trunks.setMatrixAt(i, dummy.matrix); }
            for(let i=0; i<HOUSES_PER_CHUNK * 2; i++) { c.roads.setMatrixAt(i, dummy.matrix); c.grounds.setMatrixAt(i, dummy.matrix); c.waters.setMatrixAt(i, dummy.matrix); }
            for(let i=0; i<HOUSES_PER_CHUNK; i++) { c.roofs.setMatrixAt(i, dummy.matrix); c.pGlows.setMatrixAt(i, dummy.matrix); }

            c.walls.userData = { chunkIdx: cIdx, isRoof: false }; c.roofs.userData = { chunkIdx: cIdx, isRoof: true };
            c.walls.castShadow = true; c.walls.receiveShadow = true; c.roofs.castShadow = true; c.roofs.receiveShadow = true;
            c.trunks.castShadow = true; c.trunks.receiveShadow = true; c.crowns.castShadow = true; c.crowns.receiveShadow = true;
            c.bushes.castShadow = true; c.bushes.receiveShadow = true; c.roads.receiveShadow = true; c.pBoxes.castShadow = true; c.pBoxes.receiveShadow = true;
            c.grounds.receiveShadow = true; c.waters.receiveShadow = true;

            scene.add(c.walls); scene.add(c.roofs); scene.add(c.windows); scene.add(c.roads); scene.add(c.trunks);
            scene.add(c.crowns); scene.add(c.bushes); scene.add(c.pBoxes); scene.add(c.pGlows); scene.add(c.grounds); scene.add(c.waters);
            chunks.push(c); return c;
        }

        function getActiveChunk() {
            if (chunks.length === 0) return createChunk();
            let last = chunks[chunks.length - 1];
            if (last.houseCount >= HOUSES_PER_CHUNK || last.rdCount >= HOUSES_PER_CHUNK * 1.8 || last.crCount >= HOUSES_PER_CHUNK * 5.5 || last.gCount >= HOUSES_PER_CHUNK * 1.8) return createChunk();
            return last;
        }

        // --- 5. INSTANCE PLACEMENT ---
        function addGroundInstance(c, x, y, z, colorHex, isAnim) {
            let s = isAnim ? 0.01 : 1.0;
            dummy.position.set(x, y, z); dummy.rotation.set(0, 0, 0); dummy.scale.set(s, s, s); dummy.updateMatrix();
            let id = c.gCount; c.grounds.setMatrixAt(id, dummy.matrix); dummyColor.setHex(colorHex); c.grounds.setColorAt(id, dummyColor);
            c.gCount++; c.grounds.instanceMatrix.needsUpdate = true; c.grounds.instanceColor.needsUpdate = true;
            return { type: 'ground', id: id, x: x, y: y, z: z, rotY: 0, sx: 1.0, sy: 1.0, sz: 1.0 };
        }

        function addWaterInstance(c, x, y, z, colorHex) {
            dummy.position.set(x, y, z); dummy.rotation.set(0, 0, 0); dummy.scale.set(1.0, 1.0, 1.0); dummy.updateMatrix();
            let id = c.waCount; c.waters.setMatrixAt(id, dummy.matrix); dummyColor.setHex(colorHex); c.waters.setColorAt(id, dummyColor);
            c.waCount++; c.waters.instanceMatrix.needsUpdate = true; c.waters.instanceColor.needsUpdate = true;
            animatedWater.push({ chunk: c, id: id, x: x, z: z, baseY: y, phase: hash01(Math.floor(x), Math.floor(z), 919) * Math.PI * 2 });
            return { type: 'water', id: id };
        }

        function addBlockInstance(c, x, y, z, w, h, d, rotY, colorHex, isAnim, houseId) {
            let s = isAnim ? 0.01 : 1.0; dummy.position.set(x, y, z); dummy.rotation.set(0, rotY, 0); dummy.scale.set(w * s, h * s, d * s); dummy.updateMatrix();
            let id = c.wCount; c.walls.setMatrixAt(id, dummy.matrix); dummyColor.setHex(colorHex); c.walls.setColorAt(id, dummyColor);
            c.wallToHouse[id] = houseId; c.wCount++; c.walls.instanceMatrix.needsUpdate = true; c.walls.instanceColor.needsUpdate = true;
            return { type: 'wall', id: id, x: x, y: y, z: z, rotY: rotY, sx: w, sy: h, sz: d };
        }

        function addRoofInstance(c, x, y, z, size, height, rotY, colorHex, isAnim, houseId) {
            let s = isAnim ? 0.01 : 1.0; let sx = size * 1.414, sy = height, sz = size * 1.414;
            dummy.position.set(x, y, z); dummy.rotation.set(0, rotY, 0); dummy.scale.set(sx * s, sy * s, sz * s); dummy.updateMatrix();
            let id = c.rCount; c.roofs.setMatrixAt(id, dummy.matrix); dummyColor.setHex(colorHex); c.roofs.setColorAt(id, dummyColor);
            c.roofToHouse[id] = houseId; c.rCount++; c.roofs.instanceMatrix.needsUpdate = true; c.roofs.instanceColor.needsUpdate = true;
            return { type: 'roof', id: id, x: x, y: y, z: z, rotY: rotY, sx: sx, sy: sy, sz: sz };
        }

        function addWindowInstance(c, x, y, z, w, h, rotY, isAnim) {
            let s = isAnim ? 0.01 : 1.0; dummy.position.set(x, y, z); dummy.rotation.set(0, rotY, 0); dummy.scale.set(w * s, h * s, 1 * s); dummy.updateMatrix();
            let id = c.winCount; c.windows.setMatrixAt(id, dummy.matrix); c.winCount++; c.windows.instanceMatrix.needsUpdate = true;
            return { type: 'window', id: id, x: x, y: y, z: z, rotY: rotY, sx: w, sy: h, sz: 1 };
        }

        function addPropBoxInstance(c, x, y, z, w, h, d, rotY, colorHex, isAnim) {
            let s = isAnim ? 0.01 : 1.0; dummy.position.set(x, y, z); dummy.rotation.set(0, rotY, 0); dummy.scale.set(w * s, h * s, d * s); dummy.updateMatrix();
            let id = c.pbCount; c.pBoxes.setMatrixAt(id, dummy.matrix); dummyColor.setHex(colorHex); c.pBoxes.setColorAt(id, dummyColor);
            c.pbCount++; c.pBoxes.instanceMatrix.needsUpdate = true; c.pBoxes.instanceColor.needsUpdate = true;
            return { type: 'pBox', id: id, x: x, y: y, z: z, rotY: rotY, sx: w, sy: h, sz: d };
        }

        function addPropGlowInstance(c, x, y, z, w, h, d, rotY, isAnim) {
            let s = isAnim ? 0.01 : 1.0; dummy.position.set(x, y, z); dummy.rotation.set(0, rotY, 0); dummy.scale.set(w * s, h * s, d * s); dummy.updateMatrix();
            let id = c.pgCount; c.pGlows.setMatrixAt(id, dummy.matrix); c.pgCount++; c.pGlows.instanceMatrix.needsUpdate = true;
            return { type: 'pGlow', id: id, x: x, y: y, z: z, rotY: rotY, sx: w, sy: h, sz: d };
        }

        function buildLamp(c, cx, cy, cz, yaw, lx, lz, isAnim, parts) {
            let m = 0x2a2c30; let lToG = (ox, oy, oz) => ({ x: cx + ((lx+ox) * Math.cos(yaw) + (lz+oz) * Math.sin(yaw)), y: cy + oy, z: cz + (-(lx+ox) * Math.sin(yaw) + (lz+oz) * Math.cos(yaw)) });
            let p1 = lToG(0, 1.5, 0);  parts.push(addPropBoxInstance(c, p1.x, p1.y, p1.z, 0.08, 3.0, 0.08, yaw, m, isAnim));
            let p2 = lToG(0, 3.0, 0.3); parts.push(addPropBoxInstance(c, p2.x, p2.y, p2.z, 0.12, 0.08, 0.7, yaw, m, isAnim));
            let p3 = lToG(0, 2.95, 0.45); parts.push(addPropGlowInstance(c, p3.x, p3.y, p3.z, 0.08, 0.04, 0.3, yaw, isAnim));
        }

        function buildBench(c, cx, cy, cz, yaw, lx, lz, isAnim, parts) {
            let m = 0x2a2c30; let w = 0x6b4a31; let lToG = (ox, oy, oz) => ({ x: cx + ((lx+ox) * Math.cos(yaw) + (lz+oz) * Math.sin(yaw)), y: cy + oy, z: cz + (-(lx+ox) * Math.sin(yaw) + (lz+oz) * Math.cos(yaw)) });
            let p1 = lToG(0, 0.25, 0);   parts.push(addPropBoxInstance(c, p1.x, p1.y, p1.z, 1.2, 0.08, 0.5, yaw, w, isAnim));
            let p2 = lToG(0, 0.55, -0.2); parts.push(addPropBoxInstance(c, p2.x, p2.y, p2.z, 1.2, 0.3, 0.08, yaw, w, isAnim));
            let p3 = lToG(0.4, 0.15, 0); parts.push(addPropBoxInstance(c, p3.x, p3.y, p3.z, 0.08, 0.3, 0.4, yaw, m, isAnim));
            let p4 = lToG(-0.4, 0.15, 0); parts.push(addPropBoxInstance(c, p4.x, p4.y, p4.z, 0.08, 0.3, 0.4, yaw, m, isAnim));
        }

        function buildTrash(c, cx, cy, cz, yaw, lx, lz, isAnim, parts) {
            let body = 0x3b444d; let lid = 0x232a30;
            let lToG = (ox, oy, oz) => ({ x: cx + ((lx+ox) * Math.cos(yaw) + (lz+oz) * Math.sin(yaw)), y: cy + oy, z: cz + (-(lx+ox) * Math.sin(yaw) + (lz+oz) * Math.cos(yaw)) });
            let p1 = lToG(0, 0.45, 0); parts.push(addPropBoxInstance(c, p1.x, p1.y, p1.z, 0.55, 0.9, 0.55, yaw, body, isAnim));
            let p2 = lToG(0, 0.95, 0); parts.push(addPropBoxInstance(c, p2.x, p2.y, p2.z, 0.62, 0.08, 0.62, yaw, lid, isAnim));
        }

        const propRegistry = [
            { id: 'lamp', weight: 0.35, build: buildLamp },
            { id: 'bench', weight: 0.30, build: buildBench },
            { id: 'trash', weight: 0.35, build: buildTrash }
        ];

        function addTrunkInstance(c, x, y, z, h, rotY, colorHex, isAnim) {
            let s = isAnim ? 0.01 : 1.0; dummy.position.set(x, y, z); dummy.rotation.set(0, rotY, 0); dummy.scale.set(1 * s, h * s, 1 * s); dummy.updateMatrix();

            let demandRoad = safeLots.length === 0 || forceIntersection || Math.random() < 0.20;

            if (demandRoad && validRoadExtensions.length > 0) {
                let ext = forceIntersection ? (validRoadExtensions.filter(e => !protectedRoadHeads.has(`${e.x},${e.z}`))[0] || validRoadExtensions[0]) : validRoadExtensions[Math.floor(Math.random() * validRoadExtensions.length)];
                addRoad(ext.x, ext.z, ext.dir);
                let newRoadHeadKey = `${ext.x + ext.dir.x},${ext.z + ext.dir.z}`; let newRoadLots = [];
                for (let d of DIRS) {
                    let nx = ext.x + d.x; let nz = ext.z + d.z;
                    if ((!gridMap.has(`${nx},${nz}`) || gridMap.get(`${nx},${nz}`).startsWith('N_')) && `${nx},${nz}` !== newRoadHeadKey) newRoadLots.push({ x: nx, z: nz, dx: d.x, dz: d.z });
                }
                if (newRoadLots.length > 0) { let p = newRoadLots[Math.floor(Math.random() * newRoadLots.length)]; buildHouse(p.x, p.z, -p.dx, -p.dz, isAnim, overrideName); }
            } else if (safeLots.length > 0) {
                let p = safeLots[Math.floor(Math.random() * safeLots.length)]; buildHouse(p.x, p.z, -p.dx, -p.dz, isAnim, overrideName);
            }
        }

        function simulateSubscribers(count, doAnim) {
            let i = 0; const batchSize = doAnim ? Math.max(1, Math.floor(count / 60)) : 1000;
            function addNext() {
                for(let b=0; b<batchSize; b++) { if (i < count) { spawnSubscriber(doAnim); i++; } }
                if (i < count) requestAnimationFrame(addNext);
                else { updateNaturePass(); scheduleSave(); }
            }
            addNext();
        }

        // --- 7. UNDO ---
        function pushUndo(entry) {
            undoStack.push(entry);
            if (undoStack.length > UNDO_LIMIT) undoStack.shift();
        }
        function performUndo() {
            if (undoStack.length === 0) {
                channel.postMessage({ type: 'TOAST', text: 'Nothing to undo', level: 'info' });
                return;
            }
            let e = undoStack.pop();
            if (e.kind === 'reserve' || e.kind === 'manualRoad') {
                // Inverse: remove the cell. Suppress further undo logging for this op.
                let savedRestoring = isRestoring; isRestoring = true;
                removeGridItem(e.gx, e.gz);
                isRestoring = savedRestoring;
                actionLog = actionLog.filter(a => !(a.gx === e.gx && a.gz === e.gz));
                scheduleSave();
                channel.postMessage({ type: 'TOAST', text: `Undid ${e.kind === 'reserve' ? 'reserve' : 'manual road'}`, level: 'info' });
            } else if (e.kind === 'remove') {
                // Inverse: restore what was there
                let savedRestoring = isRestoring; isRestoring = true;
                if (e.prevType === 'H' && e.prevHouseInfo) {
                    buildHouse(e.gx, e.gz, e.prevHouseInfo.lookX, e.prevHouseInfo.lookZ, false, e.prevHouseInfo.name);
                } else if (e.prevType === 'R' || e.prevType === 'R_MANUAL') {
                    addRoad(e.gx, e.gz, null, e.prevType === 'R_MANUAL');
                } else if (e.prevType === 'RES') {
                    reserveParcel(e.gx, e.gz);
                }
                isRestoring = savedRestoring;
                // Re-add to action log
                if (e.prevType === 'H' && e.prevHouseInfo) {
                    actionLog.push({ t: 'house', gx: e.gx, gz: e.gz, lookX: e.prevHouseInfo.lookX, lookZ: e.prevHouseInfo.lookZ, name: e.prevHouseInfo.name });
                } else if (e.prevType === 'R' || e.prevType === 'R_MANUAL') {
                    actionLog.push({ t: 'road', gx: e.gx, gz: e.gz, isManual: e.prevType === 'R_MANUAL' });
                } else if (e.prevType === 'RES') {
                    actionLog.push({ t: 'reserve', gx: e.gx, gz: e.gz });
                }
                scheduleSave();
                channel.postMessage({ type: 'TOAST', text: 'Restored removed cell', level: 'info' });
            }
        }

        // --- 8. PERSISTENCE ---
        function scheduleSave() {
            if (isRestoring) return;
            if (saveTimer) clearTimeout(saveTimer);
            saveTimer = setTimeout(() => { saveNow(); flashSaveIndicator(); }, SAVE_DEBOUNCE_MS);
        }
        function saveNow() {
            try {
                const data = { version: 1, theme: currentTheme, populationCount, actionLog };
                localStorage.setItem(SAVE_KEY, JSON.stringify(data));
            } catch (err) {
                console.error('Save failed:', err);
                channel.postMessage({ type: 'TOAST', text: 'Save failed: ' + err.message, level: 'error' });
            }
        }
        function flashSaveIndicator() {
            const el = document.getElementById('save-indicator');
            el.classList.add('visible');
            clearTimeout(window._saveFlashTimer);
            window._saveFlashTimer = setTimeout(() => el.classList.remove('visible'), 1200);
        }
        function resetCity() {
            // Tear down everything cleanly
            for (const c of chunks) {
                scene.remove(c.walls); scene.remove(c.roofs); scene.remove(c.windows); scene.remove(c.roads);
                scene.remove(c.trunks); scene.remove(c.crowns); scene.remove(c.bushes);
                scene.remove(c.pBoxes); scene.remove(c.pGlows); scene.remove(c.grounds); scene.remove(c.waters);
                c.walls.dispose(); c.roofs.dispose(); c.windows.dispose(); c.roads.dispose();
                c.trunks.dispose(); c.crowns.dispose(); c.bushes.dispose();
                c.pBoxes.dispose(); c.pGlows.dispose(); c.grounds.dispose(); c.waters.dispose();
            }
            chunks = []; houseData = []; activeAnimations = [];
            animatedWater.length = 0;
            gridMap = new Map(); roads = []; populationCount = 0;
            sidewalkEdges = new Map();
            undoStack = []; actionLog = [];
            try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
            // Tell UI to reset its local mirror
            channel.postMessage({ type: 'MAP_FULL', map: [], pop: 0, chunks: 0 });
            channel.postMessage({ type: 'TOAST', text: 'City reset', level: 'info' });
        }
        function loadFromStorage(notify) {
            let raw;
            try { raw = localStorage.getItem(SAVE_KEY); } catch (e) { return false; }
            if (!raw) { if (notify) channel.postMessage({ type: 'TOAST', text: 'No save found', level: 'warn' }); return false; }
            let data;
            try { data = JSON.parse(raw); } catch (e) { if (notify) channel.postMessage({ type: 'TOAST', text: 'Save file corrupted', level: 'error' }); return false; }
            if (!data || data.version !== 1 || !Array.isArray(data.actionLog)) {
                if (notify) channel.postMessage({ type: 'TOAST', text: 'Save format unrecognized', level: 'error' });
                return false;
            }

            // Wipe current state first (without clearing storage)
            for (const c of chunks) {
                scene.remove(c.walls); scene.remove(c.roofs); scene.remove(c.windows); scene.remove(c.roads);
                scene.remove(c.trunks); scene.remove(c.crowns); scene.remove(c.bushes);
                scene.remove(c.pBoxes); scene.remove(c.pGlows); scene.remove(c.grounds); scene.remove(c.waters);
                c.walls.dispose(); c.roofs.dispose(); c.windows.dispose(); c.roads.dispose();
                c.trunks.dispose(); c.crowns.dispose(); c.bushes.dispose();
                c.pBoxes.dispose(); c.pGlows.dispose(); c.grounds.dispose(); c.waters.dispose();
            }
            chunks = []; houseData = []; activeAnimations = [];
            animatedWater.length = 0;
            gridMap = new Map(); roads = []; populationCount = 0;
            sidewalkEdges = new Map();
            undoStack = []; actionLog = [];

            if (data.theme && themes[data.theme]) { currentTheme = data.theme; applyTheme(); }

            isRestoring = true;
            try {
                // Replay roads first (so sidewalks form correctly), then houses, then reserves
                const log = data.actionLog;
                for (const a of log) {
                    if (a.t === 'road') {
                        const dir = (a.dx !== null && a.dx !== undefined) ? { x: a.dx, z: a.dz } : null;
                        addRoad(a.gx, a.gz, dir, !!a.isManual);
                    }
                }
                for (const a of log) {
                    if (a.t === 'house') buildHouse(a.gx, a.gz, a.lookX, a.lookZ, false, a.name);
                }
                for (const a of log) {
                    if (a.t === 'reserve') reserveParcel(a.gx, a.gz);
                }
                actionLog = log.slice();
                updateNaturePass();
            } finally {
                isRestoring = false;
            }
            sendFullMap();
            if (notify) channel.postMessage({ type: 'TOAST', text: `Loaded ${actionLog.filter(a=>a.t==='house').length} houses`, level: 'info' });
            return true;
        }

        // --- 9. SEARCH & INPUT ---
        function searchSubscriber(term) {
            term = term.toLowerCase().trim(); if (!term) return; let foundId = -1;
            for (let i = 0; i < houseData.length; i++) { if (houseData[i] && houseData[i].name.toLowerCase().includes(term)) { foundId = i; break; } }
            if (foundId >= 0) {
                if (hoveredHouseId >= 0) unhighlight(hoveredHouseId);
                let hd = houseData[foundId]; trackedHouseId = foundId; hoveredHouseId = foundId;
                highlight(foundId); tooltip.innerText = hd.name; tooltip.style.opacity = 1;
                controls.autoRotate = false;
                targetControlsPos.set(hd.globalX, 0, hd.globalZ); targetCameraPos.set(hd.globalX + 40, 40, hd.globalZ + 40);
                targetCameraZoom = 4.5; isCameraAnimating = true;
            } else {
                channel.postMessage({ type: 'TOAST', text: `No subscriber matches "${term}"`, level: 'warn' });
            }
        }

        const tooltip = document.getElementById('tooltip'); let hoveredHouseId = -1; let trackedHouseId = -1;
        let isCameraAnimating = false; let targetControlsPos = new THREE.Vector3(); let targetCameraPos = new THREE.Vector3(); let targetCameraZoom = 1;

        function highlight(hId) {
            if(hId < 0 || !houseData[hId]) return; let hd = houseData[hId]; let c = chunks[hd.chunkIdx];
            for(let i=0; i<hd.wCount; i++) c.walls.setColorAt(hd.wStart + i, highlightColor);
            for(let i=0; i<hd.rCount; i++) c.roofs.setColorAt(hd.rStart + i, highlightColor);
            c.walls.instanceColor.needsUpdate = true; c.roofs.instanceColor.needsUpdate = true;
        }

        function unhighlight(hId) {
            if(hId < 0 || !houseData[hId]) return; let hd = houseData[hId]; let c = chunks[hd.chunkIdx];
            dummyColor.setHex(hd.colorHex); for(let i=0; i<hd.wCount; i++) c.walls.setColorAt(hd.wStart + i, dummyColor);
            dummyColor.setHex(hd.roofHex); for(let i=0; i<hd.rCount; i++) c.roofs.setColorAt(hd.rStart + i, dummyColor);
            c.walls.instanceColor.needsUpdate = true; c.roofs.instanceColor.needsUpdate = true;
        }

        const raycaster = new THREE.Raycaster(); const mouse = new THREE.Vector2();

        window.addEventListener('mousemove', (event) => {
            if (currentTool !== 'none') return;
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1; mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            if (!window.hoverThrottled) {
                window.hoverThrottled = true; setTimeout(() => window.hoverThrottled = false, 100);
                raycaster.setFromCamera(mouse, camera); let targets = []; for(let c of chunks) { targets.push(c.walls); targets.push(c.roofs); }
                let hits = raycaster.intersectObjects(targets);
                if(hits.length > 0) {
                    let hit = hits[0]; let c = chunks[hit.object.userData.chunkIdx];
                    let houseId = hit.object.userData.isRoof ? c.roofToHouse[hit.instanceId] : c.wallToHouse[hit.instanceId];
                    if(houseId !== hoveredHouseId && houseId >= 0) {
                        unhighlight(hoveredHouseId); highlight(houseId); hoveredHouseId = houseId; trackedHouseId = -1;
                        tooltip.style.opacity = 1; tooltip.innerText = houseData[houseId].name;
                    }
                    if (trackedHouseId === -1 && houseId >= 0) { tooltip.style.left = event.clientX + 'px'; tooltip.style.top = event.clientY + 'px'; }
                } else { if (trackedHouseId === -1) { unhighlight(hoveredHouseId); hoveredHouseId = -1; tooltip.style.opacity = 0; } }
            }
        });

        window.addEventListener('mousedown', (event) => {
            if (currentTool === 'none') return;
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1; mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            let hits = raycaster.intersectObject(plane);
            if (hits.length > 0) {
                let gx = Math.round(hits[0].point.x / CELL_SIZE); let gz = Math.round(hits[0].point.z / CELL_SIZE);
                if (currentTool === 'reserve') reserveParcel(gx, gz);
                else if (currentTool === 'road') addRoad(gx, gz, null, true);
                else if (currentTool === 'remove') removeGridItem(gx, gz);
            }
        });

        // --- 10. RENDER LOOP ---
        function animate() {
            requestAnimationFrame(animate); controls.update();
            if (isCameraAnimating) {
                controls.target.lerp(targetControlsPos, 0.05); camera.position.lerp(targetCameraPos, 0.05);
                camera.zoom += (targetCameraZoom - camera.zoom) * 0.05; camera.updateProjectionMatrix();
                if (camera.position.distanceTo(targetCameraPos) < 0.5 && Math.abs(camera.zoom - targetCameraZoom) < 0.01) isCameraAnimating = false;
            }

            if (trackedHouseId >= 0 && houseData[trackedHouseId]) {
                let vec = new THREE.Vector3(houseData[trackedHouseId].globalX, 10, houseData[trackedHouseId].globalZ); vec.project(camera);
                tooltip.style.left = ((vec.x * 0.5 + 0.5) * window.innerWidth) + 'px'; tooltip.style.top = ((-vec.y * 0.5 + 0.5) * window.innerHeight) + 'px';
            }

            if (activeAnimations.length > 0) {
                let chunksToUpdate = new Set();
                for (let i = activeAnimations.length - 1; i >= 0; i--) {
                    let anim = activeAnimations[i]; anim.progress += 0.08;
                    if (anim.progress >= 1.0) { anim.progress = 1.0; activeAnimations.splice(i, 1); }
                    let ease = 1 - Math.pow(1 - anim.progress, 3);
                    for (let part of anim.parts) {
                        dummy.position.set(part.x, part.y, part.z); dummy.rotation.set(0, part.rotY, 0); dummy.scale.set(part.sx * ease, part.sy * ease, part.sz * ease); dummy.updateMatrix();
                        if (part.type === 'wall') anim.chunk.walls.setMatrixAt(part.id, dummy.matrix);
                        else if (part.type === 'roof') anim.chunk.roofs.setMatrixAt(part.id, dummy.matrix);
                        else if (part.type === 'window') anim.chunk.windows.setMatrixAt(part.id, dummy.matrix);
                        else if (part.type === 'trunk') anim.chunk.trunks.setMatrixAt(part.id, dummy.matrix);
                        else if (part.type === 'crown') anim.chunk.crowns.setMatrixAt(part.id, dummy.matrix);
                        else if (part.type === 'bush') anim.chunk.bushes.setMatrixAt(part.id, dummy.matrix);
                        else if (part.type === 'pBox') anim.chunk.pBoxes.setMatrixAt(part.id, dummy.matrix);
                        else if (part.type === 'pGlow') anim.chunk.pGlows.setMatrixAt(part.id, dummy.matrix);
                        else if (part.type === 'ground') anim.chunk.grounds.setMatrixAt(part.id, dummy.matrix);
                    }
                    chunksToUpdate.add(anim.chunk);
                }
                for (let c of chunksToUpdate) {
                    c.walls.instanceMatrix.needsUpdate = true; c.roofs.instanceMatrix.needsUpdate = true; c.windows.instanceMatrix.needsUpdate = true;
                    c.trunks.instanceMatrix.needsUpdate = true; c.crowns.instanceMatrix.needsUpdate = true; c.bushes.instanceMatrix.needsUpdate = true;
                    c.pBoxes.instanceMatrix.needsUpdate = true; c.pGlows.instanceMatrix.needsUpdate = true; c.grounds.instanceMatrix.needsUpdate = true;
                }
            }

            if (animatedWater.length > 0) {
                const t = performance.now() * 0.001;
                const waterChunks = new Set();
                for (const w of animatedWater) {
                    dummy.position.set(w.x, w.baseY + Math.sin(t * 1.6 + w.phase) * 0.04, w.z);
                    dummy.rotation.set(0, 0, 0);
                    const stretch = 1.0 + Math.sin(t * 1.2 + w.phase) * 0.03;
                    dummy.scale.set(stretch, 1.0, stretch);
                    dummy.updateMatrix();
                    w.chunk.waters.setMatrixAt(w.id, dummy.matrix);
                    waterChunks.add(w.chunk);
                }
                for (const c of waterChunks) c.waters.instanceMatrix.needsUpdate = true;
            }
            renderer.render(scene, camera);
        }

        function applyTheme() {
            const t = themes[currentTheme];
            scene.background.setHex(t.bg);
            scene.fog.color.setHex(t.fog);
            plane.material.color.setHex(t.ocean);
            waterMat.color.setHex(t.water);
            roadMat.map = makeNoiseTexture(t.road, 18);
            roadMat.needsUpdate = true;
        }

        // --- 11. BOOT ---
        const loaded = loadFromStorage(false);
        if (!loaded) {
            updateNaturePass();
        }
        animate();

        window.addEventListener('resize', () => {
            const aspect = window.innerWidth / window.innerHeight; camera.left = -d * aspect; camera.right = d * aspect;
            camera.top = d; camera.bottom = -d; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Save before unload as a final safety
        window.addEventListener('beforeunload', () => { saveNow(); });
    </script>
</body>
</html>
